name: utc-rag-chatbot

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [utc]

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-utc_rag}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-utc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      OLLAMA_BASE_URL: http://ai:11434
      SLM_MODEL: ${SLM_MODEL:-qwen3:0.6b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m-qat-q4_0}
      EMBEDDING_DIMENSION: "768"
      CURSOR_SECRET: ${CURSOR_SECRET:?Set a random CURSOR_SECRET with at least 32 characters}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-5s}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-120s}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      CHAT_PER_MINUTE: ${CHAT_PER_MINUTE:-10}
      SCORES_PER_MINUTE: ${SCORES_PER_MINUTE:-30}
      UPLOADS_PER_MINUTE: ${UPLOADS_PER_MINUTE:-10}
      JOBS_PER_MINUTE: ${JOBS_PER_MINUTE:-10}
      UPLOAD_DIRECTORY: /app/uploads
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [utc]

  # Crawler worker - processes crawl jobs from queue
  crawler-worker:
    build: ./tools
    command: ["python", "-m", "src.main"]
    environment:
      # Database Configuration
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-utc_rag}
      DATABASE_USER: ${POSTGRES_WORKER_USER:-utc}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "10"
      DATABASE_TIMEOUT_SECONDS: "30"
      DATABASE_MAX_WAITING: "10"
      
      # Ollama Configuration
      OLLAMA_BASE_URL: http://ai:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m-qat-q4_0}
      EMBEDDING_DIMENSION: "768"
      OLLAMA_TIMEOUT_SECONDS: "120"
      
      # Crawler Configuration
      USER_AGENT: "UTC-RAG-Crawler/1.0"
      MAX_RETRIES: "3"
      REQUEST_TIMEOUT_SECONDS: "30"
      DEFAULT_RATE_LIMIT_SECONDS: "2.0"
      MAX_CONTENT_SIZE_MB: "50"
      RESPECT_ROBOTS_TXT: "true"
      
      # Worker Configuration
      JOB_CLAIM_TIMEOUT_SECONDS: "10"
      HEARTBEAT_INTERVAL_SECONDS: "180"
      LEASE_DURATION_SECONDS: "600"
      MAX_CLAIM_WAIT_SECONDS: "30"
      
    depends_on:
      database:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import psycopg; conn = psycopg.connect(host=\"database\", port=5432, dbname=\"${POSTGRES_DB:-utc_rag}\", user=\"${POSTGRES_WORKER_USER:-utc}\", password=\"${POSTGRES_PASSWORD}\"); conn.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [utc]

  # Crawler scheduler - creates jobs periodically for enabled sources
  crawler-scheduler:
    build: ./tools
    command: ["python", "-m", "src.scheduler"]
    environment:
      # Database Configuration (scheduler only needs database, not Ollama)
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-utc_rag}
      DATABASE_USER: ${POSTGRES_WORKER_USER:-utc}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "2"
      DATABASE_TIMEOUT_SECONDS: "30"
      DATABASE_MAX_WAITING: "5"
      
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import psycopg; conn = psycopg.connect(host=\"database\", port=5432, dbname=\"${POSTGRES_DB:-utc_rag}\", user=\"${POSTGRES_WORKER_USER:-utc}\", password=\"${POSTGRES_PASSWORD}\"); conn.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [utc]

  database:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utc_rag}
      POSTGRES_USER: ${POSTGRES_USER:-utc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [utc]

  ai:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [utc]

networks:
  utc:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  document_uploads:
